<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Arial, sans-serif; width: 380px; padding: 12px; }
      label { display:block; margin-top:8px; font-size:12px; color:#333; }
      input[type="text"], select, textarea { width:100%; padding:6px; box-sizing:border-box; }
      button { margin-top:10px; padding:8px 12px; }
      .small { font-size:12px; color:#666; margin-top:6px; }
      .row { display:flex; gap:8px; align-items:center; }
      .row > * { flex:1; }
      #previewRow { margin-top:8px; display:flex; gap:8px; align-items:center; }
      #previewBox { flex:1; }
    </style>
  </head>
  <body>
    <label>CSS selector for case title element(s)</label>
    <input id="selector" type="text" placeholder=".case-title, #case_title, input[name='title']" />

    <label>Case code → definition</label>
    <select id="codeSelect"></select>

    <label class="small">
      <input id="preserveRest" type="checkbox" /> Replace only leading code (preserve the rest of the title)
    </label>

    <label class="small">Optional: CSS selector for Save button to click after update</label>
    <input id="saveSelector" type="text" placeholder=".save-btn, button[type=submit]" />

    <div id="previewRow">
      <input id="previewBox" type="text" readonly placeholder="Preview will appear here" />
      <button id="copyBtn">Copy</button>
    </div>

    <div class="row">
      <button id="apply">Apply</button>
      <button id="preview">Preview</button>
    </div>

    <div id="status" class="small"></div>

    <script src="popup.js"></script>
  </body>
</html>
